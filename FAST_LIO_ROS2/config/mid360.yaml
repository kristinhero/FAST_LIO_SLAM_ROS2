/**:
    ros__parameters:
        feature_extract_enable: false # Feature extraction is currently not supported for MID-360, so please set as false.
        point_filter_num: 3
        max_iteration: 20
        filter_size_surf: 0.3
        filter_size_map: 0.5
        cube_side_length: 1000.0
        runtime_pos_log_enable: true
        map_file_path: "./test.pcd"

        common:
            lid_topic:  "/livox/lidar"
            imu_topic:  "/livox/imu"
            time_sync_en: false         # ONLY turn on when external time synchronization is really not possible
            time_offset_lidar_to_imu: 0.0 # Time offset between lidar and IMU calibrated by other algorithms, e.g. LI-Init (can be found in README).
                                        # This param will take effect no matter what time_sync_en is. So if the time offset is not known exactly, please set as 0.0
            lidar_reliable_qos: true    # true: RELIABLE QoS for bag replay; false: BEST_EFFORT (SensorDataQoS) for live sensor

        preprocess:
            lidar_type: 4                # 1 for Livox serials LiDAR, 2 for Velodyne LiDAR, 3 for ouster LiDAR, 4 for Livox MID-360 with PointCloud2, 5 for any other pointcloud input
            scan_line:  4
            blind: 0.5
            timestamp_unit: 3 # 0 for seconds, 1 for milliseconds, 2 for microseconds, 3 for nanoseconds, 4 for raw timestamp (no unit, directly use the timestamp in the point cloud message), 5 for custom time unit (set by time_unit_scale)
            scan_rate: 10
            imu_unit_g: true # true: the linear acceleration in IMU messages is in g unit; false: the linear acceleration is in m/s²

        mapping:
            acc_cov: 0.1
            gyr_cov: 0.1
            b_acc_cov: 0.0001
            b_gyr_cov: 0.0001
            fov_degree:    360.0
            det_range:     100.0
            extrinsic_est_en:  false      # true: enable the online estimation of IMU-LiDAR extrinsic
            debug_scan_en: true          # true: save local map + per-iteration costs at DEBUG_TIME_START/END
            extrinsic_T: [ -0.011, -0.02329, 0.04412 ]
            extrinsic_R: [ 1., 0., 0.,
                            0., 1., 0.,
                            0., 0., 1.]

        publish:
            path_en: true                # true: publish Path
            effect_map_en: false         # true: publish Effects
            map_en: true                 # true: publish Map cloud
            scan_publish_en:  true       # false: close all the point cloud output
            dense_publish_en: false      # false: low down the points number in a global-frame point clouds scan.
            scan_bodyframe_pub_en: true  # true: output the point cloud scans in IMU-body-frame

        pcd_save:
            pcd_save_en: true
            interval: 600                 # how many LiDAR frames saved in each pcd file; 
                                        # -1 : all frames will be saved in ONE pcd file, may lead to memory crash when having too much frames.
